# ============================================================
# RAG CONFIGURATION
# ============================================================

project:
  name: "intermediate-rag"
  stage: "learning"
  entrypoint: "main.py"

# ------------------------------------------------------------
# Paths
# ------------------------------------------------------------
paths:
  data:
    raw_dir: "rag_project/data/raw"

  vector_store:
    chroma_dir: "rag_project/vector_store/chroma"

# ------------------------------------------------------------
# Chunking
# ------------------------------------------------------------
chunking:
  recursive:
    chunk_size: 600
    overlap: 100

  semantic:
    enabled: true
    method: "langchain"

# ------------------------------------------------------------
# Embeddings
# ------------------------------------------------------------
embeddings:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  normalize: true
  batch_size: 32

# ------------------------------------------------------------
# Chroma
# ------------------------------------------------------------
chroma:
  collection_name: "ashwa_rag"
  persist: true
  distance_metric: "cosine"
  index_type: "hnsw"

# ------------------------------------------------------------
# Retrieval
# ------------------------------------------------------------
retrieval:
  top_k: 6        # final documents sent to LLM
  fetch_k: 15     # candidate pool size for reranking

# ------------------------------------------------------------
# Reranker
# ------------------------------------------------------------
reranker:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_n: 3        # final documents sent to LLM after reranking

# ------------------------------------------------------------
# LLM Configuration
# ------------------------------------------------------------
llm:
  provider: "ollama"
  model: "qwen2.5:3b"

  temperature: 0.1
  max_tokens: 128
  top_p: 0.8
  repeat_penalty: 1.1

  context_truncate: true
  max_context_chars: 3000
  stream: true

# ------------------------------------------------------------
# Query Settings
# ------------------------------------------------------------
query:
  show_context: false
  max_context_length: 2000
  exit_command: "exit"

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging:
  level: "INFO"
  log_to_file: false
  log_file: "logs/rag.log"

# ------------------------------------------------------------
# API Configuration
# ------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000

  max_concurrent_requests: 3
  enable_semaphore: true
  workers: 2

  min_query_length: 5
  request_timeout: 300

# ------------------------------------------------------------
# DB Configuration
# ------------------------------------------------------------
database:
  auto_clear_on_start: false
  require_existing_db: true

# ------------------------------------------------------------
# Application Selector
# ------------------------------------------------------------
app:
  active_poc: "poc2"      # poc1 | poc2 | experimental

  poc1:
    api_module: "rag_project.api.app:app"
    streamlit_entry: "frontend/Data_base_loader.py"

  poc2:
    api_module: "rag_project.api.app:app"
    streamlit_entry: "frontend/The_Ashwa_Riders.py"


# ------------------------------------------------------------
# Cache Configuration
# ------------------------------------------------------------
cache:
  enabled: true
  ttl_seconds: 300
